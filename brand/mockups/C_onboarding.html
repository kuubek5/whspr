<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KuubWave — перший запуск</title>
<style>
:root{
  --bg:#FBF7F5; --card:#FFFFFF; --ink:#1B1720; --t2:#6B6470; --t3:#9A93A0;
  --line:rgba(27,23,32,.09); --line2:rgba(27,23,32,.15); --field:#FFFFFF; --field2:#F6F1EE;
  --coral:#FF6B5E; --coral-d:#EE5348; --coral-ink:#D8382D; --coral-wash:#FFECE9;
  --aqua:#0FA598; --aqua-wash:rgba(15,165,152,.12); --violet:#6D5AE6;
  --sh:0 1px 2px rgba(27,23,32,.05),0 10px 26px rgba(27,23,32,.07);
  --sh-sm:0 1px 2px rgba(27,23,32,.06),0 4px 12px rgba(27,23,32,.05);
  --r:16px;
}
:root[data-theme="dark"]{--bg:#171319;--card:#221C29;--ink:#F4EEF2;--t2:#B0A6B4;--t3:#786E7E;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--field:#2A2331;--field2:#221C29;--coral-ink:#FF9488;--coral-wash:rgba(255,122,110,.16);--aqua:#33CBBB;--aqua-wash:rgba(51,203,187,.15);--sh-sm:0 1px 2px rgba(0,0,0,.4),0 5px 14px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes w{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes mesh{0%,100%{background-position:0% 0%,100% 0%,50% 100%,0% 100%}50%{background-position:30% 22%,68% 42%,42% 68%,20% 58%}}

/* rail */
.rail{width:290px;flex-shrink:0;color:#fff;padding:32px 28px;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:#EE5348;background-image:radial-gradient(42% 62% at 15% 20%,#FF9A7B,transparent 60%),radial-gradient(46% 66% at 82% 28%,#FF5E6E,transparent 60%),radial-gradient(52% 72% at 62% 92%,#7A5CE6,transparent 55%),radial-gradient(46% 60% at 28% 82%,#FF6B5E,transparent 60%);
  background-size:200% 200%;animation:mesh 18s ease-in-out infinite}
.rbrand{display:flex;align-items:center;gap:11px;margin-bottom:34px}
.rbrand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:13px;padding:10px 8px;border-radius:12px;transition:.2s}
.step.on{background:rgba(255,255,255,.16)}
.step .num{width:26px;height:26px;border-radius:50%;background:rgba(20,12,16,.34);border:1px solid rgba(255,255,255,.30);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;line-height:1;flex-shrink:0;transition:.2s;font-variant-numeric:tabular-nums}
.step .num svg{display:block}
.step .num .nn{display:block;transform:translateY(.5px)}
.step.on .num{background:#fff;border-color:#fff;color:var(--coral-d)}
.step.done .num{background:#fff;border-color:#fff;color:var(--coral-d)}
.step .lb{font-size:13px;font-weight:500;opacity:.85}
.step.on .lb{opacity:1}
.rfoot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;opacity:.8}
.rfoot .d{width:8px;height:8px;border-radius:50%;background:#fff}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.body{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:40px}
.pane{width:100%;max-width:560px;animation:fadeUp .35s cubic-bezier(.22,1,.36,1)}
.eyebrowless h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-bottom:10px;line-height:1.1}
h1 span{color:var(--coral)}
.sub{font-size:14px;color:var(--t2);line-height:1.55;margin-bottom:28px;max-width:460px}
.feat{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.feat:first-of-type{border-top:none}
.feat .fi{width:42px;height:42px;border-radius:12px;background:var(--coral-wash);color:var(--coral-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feat .ft{font-size:14px;font-weight:600;margin-bottom:2px}
.feat .fd{font-size:12.5px;color:var(--t3);line-height:1.5}
.step-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.step-sub{font-size:13px;color:var(--t3);margin-bottom:24px;line-height:1.5}

.seg{display:inline-flex;background:var(--field2);border-radius:13px;padding:4px;width:100%}
.seg button{flex:1;border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--t2);padding:13px;border-radius:10px;cursor:pointer;transition:.14s;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button.on{background:var(--card);color:var(--coral-ink);box-shadow:var(--sh-sm)}
.flag{width:19px;height:13px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}

.mcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{position:relative;border:1.5px solid var(--line);border-radius:15px;padding:16px;cursor:pointer;transition:.14s;background:var(--field)}
.mcard:hover{border-color:var(--line2)}
.mcard.on{border-color:var(--coral);background:var(--coral-wash)}
.mcard .chk{position:absolute;top:11px;right:11px;width:20px;height:20px;border-radius:50%;background:var(--coral);color:#fff;display:none;align-items:center;justify-content:center}
.mcard.on .chk{display:flex}
.mcard .rec{position:absolute;top:11px;right:11px;font-size:9.5px;font-weight:700;color:var(--aqua);background:var(--aqua-wash);border-radius:6px;padding:3px 7px}
.mcard.on .rec{display:none}
.mcard .nm{font-size:14px;font-weight:600;margin-bottom:5px;padding-right:24px}
.mcard .meta{font-size:11.5px;color:var(--t3);line-height:1.4}

.checkrow{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:15px;margin-bottom:12px;background:var(--field)}
.checkrow .ci{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--aqua-wash);color:var(--aqua)}
.checkrow .ct{flex:1}.checkrow .ck{font-size:14px;font-weight:600}.checkrow .cd{font-size:12px;color:var(--t3);margin-top:2px}
.okpill{font-size:11.5px;font-weight:700;color:var(--aqua);display:flex;align-items:center;gap:5px}
.level{flex:1;height:9px;border-radius:6px;background:var(--field2);overflow:hidden;position:relative}
.level .fill{height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:var(--aqua);border-radius:6px;transition:transform .08s linear}
.btn{font-family:inherit;border:none;border-radius:11px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn.pri{background:var(--coral);color:#fff}.btn.pri:hover{background:var(--coral-d)}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.keycap{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:56px;padding:0 16px;border-radius:13px;background:var(--field);border:1px solid var(--line2);border-bottom-width:3px;font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;color:var(--ink)}
.hkwrap{display:flex;align-items:center;gap:18px;padding:18px;border:1px solid var(--line);border-radius:15px;background:var(--field)}
.inp{width:100%;font-family:'JetBrains Mono',monospace;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--ink);font-size:13.5px;outline:none;transition:.15s}
.inp:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-wash)}
.lic-alt{margin-top:14px;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--t3)}
.lic-alt a{color:var(--coral);font-weight:600;cursor:pointer}
.done-mark{width:88px;height:88px;border-radius:26px;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 14px 34px rgba(238,83,72,.3)}
.done-kbd{display:inline-flex;align-items:center;gap:10px;font-size:17px;font-weight:600;margin-top:4px}
.done-kbd .key{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--field2);border-radius:9px;padding:5px 12px}

/* footer */
.foot{height:78px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;flex-shrink:0}
.dots{display:flex;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:.2s}
.dot.on{background:var(--coral);width:22px;border-radius:5px}
.skip{background:none;border:none;font-family:inherit;font-size:12.5px;color:var(--t3);cursor:pointer}
.skip:hover{color:var(--ink)}
</style>
</head>
<body>
<aside class="rail">
  <div class="rbrand">
    <svg width="34" height="34" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="26" fill="rgba(0,0,0,.22)"/><g stroke="#fff" stroke-width="8" stroke-linecap="round"><path d="M28 30v40"/><path d="M40 44v28"/><path d="M40 44c6 0 6 18 12 18"/><path d="M52 62V34"/><path d="M64 40 76 62M64 62 76 40"/></g></svg>
    <b>kuubwave</b>
  </div>
  <div class="steps" id="steps"></div>
  <div class="rfoot"><span class="d"></span>Локально · приватно · офлайн</div>
</aside>
<main class="main">
  <div class="body"><div class="pane" id="pane"></div></div>
  <div class="foot">
    <button class="skip" id="back">← Назад</button>
    <div class="dots" id="dots"></div>
    <button class="btn pri" id="next">Далі</button>
  </div>
</main>
<script>
const svg=(p,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={shield:'<path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/>',bolt:'<path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/>',cursor:'<path d="M3 3l7 18 2-7 7-2L3 3Z"/>',mic:'<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>',gpu:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',check:'<path d="M20 6 9 17l-5-5"/>',key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.5 12.5 20 3l1 4-3 1 1 3-3 1"/>'};
const FLAG_UA='<svg class="flag" viewBox="0 0 3 2"><rect width="3" height="1" fill="#0057B7"/><rect width="3" height="1" y="1" fill="#FFD700"/></svg>';
const FLAG_GB='<svg class="flag" viewBox="0 0 60 30"><clipPath id="s"><rect width="60" height="30"/></clipPath><g clip-path="url(#s)"><rect width="60" height="30" fill="#012169"/><path d="M0 0 60 30M60 0 0 30" stroke="#fff" stroke-width="6"/><path d="M0 0 60 30M60 0 0 30" clip-path="url(#s)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg>';

const STEPS=["Вітаємо","Мова","Модель","Перевірка","Клавіша","Ліцензія","Готово"];
const st={i:0, lang:"uk", model:"uk-ft", hotkey:"Fn"};

function renderRail(){
  document.getElementById("steps").innerHTML=STEPS.map((s,i)=>`
    <div class="step ${i===st.i?'on':''} ${i<st.i?'done':''}">
      <div class="num">${i<st.i?svg(I.check,14):'<span class="nn">'+(i+1)+'</span>'}</div><div class="lb">${s}</div></div>`).join("");
  document.getElementById("dots").innerHTML=STEPS.map((_,i)=>`<div class="dot ${i===st.i?'on':''}"></div>`).join("");
  document.getElementById("back").style.visibility=st.i===0?"hidden":"visible";
  const nx=document.getElementById("next");
  nx.textContent=st.i===STEPS.length-1?"Завершити":(st.i===0?"Почати":"Далі");
}
function panes(){return [
  // 0 welcome
  `<div class="eyebrowless"><h1>Вітаємо у <span>KuubWave</span></h1>
   <div class="sub">Диктування українською та англійською, що працює будь-де на екрані. Розпізнавання йде на вашому GPU — жодне слово не залишає цей компʼютер.</div>
   <div class="feat"><div class="fi">${svg(I.shield)}</div><div><div class="ft">Приватно й офлайн</div><div class="fd">Аудіо обробляється локально, без хмари</div></div></div>
   <div class="feat"><div class="fi">${svg(I.bolt)}</div><div><div class="ft">Швидко на GPU</div><div class="fd">Розпізнавання за частку секунди</div></div></div>
   <div class="feat"><div class="fi">${svg(I.cursor)}</div><div><div class="ft">Будь-де на екрані</div><div class="fd">Затисніть клавішу — і диктуйте в будь-яке поле</div></div></div></div>`,
  // 1 language
  `<div class="step-title">Мова диктування</div><div class="step-sub">Можна змінити будь-коли в налаштуваннях.</div>
   <div class="seg" id="lseg">
     <button data-l="uk" class="${st.lang==='uk'?'on':''}">${FLAG_UA}Українська</button>
     <button data-l="en" class="${st.lang==='en'?'on':''}">${FLAG_GB}English</button>
     <button data-l="auto" class="${st.lang==='auto'?'on':''}">Авто</button></div>`,
  // 2 model
  `<div class="step-title">Оберіть модель</div><div class="step-sub">Більша — точніша, менша — швидша. Завантажите пізніше, якщо треба.</div>
   <div class="mcards" id="mcards">
     ${[["uk-ft","Large v3 Turbo UA","1.5 GB · донавчена на українській",true],["stock","Large v3 Turbo","1.5 GB · швидка, універсальна",false],["large-v3","Large v3","2.9 GB · найточніша",false],["small","Small","465 MB · для слабших GPU",false]].map(([id,nm,meta,rec])=>
       `<div class="mcard ${st.model===id?'on':''}" data-m="${id}"><div class="chk">${svg(I.check,12)}</div>${rec?'<div class="rec">Радимо</div>':''}<div class="nm">${nm}</div><div class="meta">${meta}</div></div>`).join("")}</div>`,
  // 3 check
  `<div class="step-title">Перевірка системи</div><div class="step-sub">Переконаймося, що все готове до диктування.</div>
   <div class="checkrow"><div class="ci">${svg(I.gpu)}</div><div class="ct"><div class="ck">Відеокарта</div><div class="cd">RTX 4070 · CUDA</div></div><div class="okpill">${svg(I.check,14)}Готово</div></div>
   <div class="checkrow"><div class="ci">${svg(I.mic)}</div><div class="ct"><div class="ck">Мікрофон</div><div class="cd">Мікрофон (Realtek Audio)</div></div><button class="btn ghost" id="micBtn">Перевірити</button></div>
   <div class="checkrow" style="gap:12px"><div class="ct" style="max-width:none"><div class="cd" id="micHint">Натисніть «Перевірити» і скажіть кілька слів</div></div><div class="level"><div class="fill" id="lvl"></div></div></div>`,
  // 4 hotkey
  `<div class="step-title">Гаряча клавіша</div><div class="step-sub">Утримуйте цю клавішу, щоб диктувати. Відпустіть — текст зʼявиться там, де курсор.</div>
   <div class="hkwrap"><span class="keycap" id="cap">${st.hotkey}</span>
     <div style="flex:1"><div style="font-size:13.5px;font-weight:600">Утримувати для диктування</div><div style="font-size:12px;color:var(--t3);margin-top:2px">Натисніть «Змінити» та виконайте комбінацію</div></div>
     <button class="btn ghost" id="hkBtn">Змінити</button></div>`,
  // 5 license
  `<div class="step-title">Ліцензія</div><div class="step-sub">Введіть ключ, який ви отримали після покупки.</div>
   <input class="inp" placeholder="Вставте ключ ліцензії" id="lic">
   <div class="lic-alt"><span>Ще не купили?</span><a>Почати пробний період 14 днів</a><span>·</span><a>Купити ключ</a></div>`,
  // 6 done
  `<div style="text-align:center;display:flex;flex-direction:column;align-items:center">
     <div class="done-mark">${svg(I.check,44)}</div>
     <div class="step-title">Все готово!</div>
     <div class="step-sub" style="margin-bottom:8px">KuubWave працює у треї. Спробуйте прямо зараз:</div>
     <div class="done-kbd">Затисніть <span class="key">${st.hotkey}</span> і говоріть</div></div>`,
];}
function render(){
  renderRail();
  document.getElementById("pane").innerHTML=panes()[st.i];
  // wire step-specific controls
  if(st.i===1)document.querySelectorAll("#lseg button").forEach(b=>b.onclick=()=>{st.lang=b.dataset.l;document.querySelectorAll("#lseg button").forEach(x=>x.classList.toggle("on",x===b));});
  if(st.i===2)document.querySelectorAll("#mcards .mcard").forEach(c=>c.onclick=()=>{st.model=c.dataset.m;document.querySelectorAll("#mcards .mcard").forEach(x=>x.classList.toggle("on",x===c));});
  if(st.i===3){const b=document.getElementById("micBtn");let tm=null;b.onclick=()=>{if(tm){clearInterval(tm);tm=null;b.textContent="Перевірити";document.getElementById("lvl").style.transform="scaleX(0)";document.getElementById("micHint").textContent="Натисніть «Перевірити» і скажіть кілька слів";return;}
    b.textContent="Стоп";b.classList.add("pri");b.classList.remove("ghost");document.getElementById("micHint").textContent="Мікрофон чує голос ✓";
    tm=setInterval(()=>{document.getElementById("lvl").style.transform=`scaleX(${0.1+Math.random()*0.7})`;},100);};}
  if(st.i===4){const b=document.getElementById("hkBtn");b.onclick=()=>{const on=b.textContent==="Змінити";b.textContent=on?"Слухаю…":"Змінити";b.classList.toggle("pri",on);b.classList.toggle("ghost",!on);};}
}
document.getElementById("next").onclick=()=>{if(st.i<STEPS.length-1){st.i++;render();}else{alert("Онбординг завершено → відкриється головний екран");}};
document.getElementById("back").onclick=()=>{if(st.i>0){st.i--;render();}};
render();
</script>
</body>
</html>
